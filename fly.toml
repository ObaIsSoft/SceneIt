# fly.toml app configuration file generated for sceneit on 2025-12-30T22:09:58+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sceneit-mvp'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/sceneit.db'
  MODEL_DIR = '/app/models'
  OUTPUT_DIR = '/data/output_frames'

[[mounts]]
  source = 'sceneit_data'
  destination = '/data'

[http_service]
  internal_port = 5002
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# Sized for the `serve` target, which does NOT load the captioning model.
# Captioning is an ingest-time job: run it as a separate, larger Machine
#     fly machine run <image>:full --vm-memory 4096 -- python app.py --extract
# rather than paying for 4 GB on every web replica.
#
# Qwen3.5-2B Q4_K_M needs ~1.3 GB resident for weights plus ~0.7 GB for the
# vision projector, so the `full` target will OOM at 2 GB.
[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
