# fly.toml app configuration file generated for sceneit on 2025-12-30T22:09:58+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sceneit-mvp'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/sceneit.db'
  OUTPUT_DIR = '/data/output_frames'

[[mounts]]
  source = 'sceneit_data'
  destination = '/data'

[http_service]
  internal_port = 5002
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
